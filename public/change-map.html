<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ACKO Copy Generator — Change Map</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#6841E6;--purple-l:#EAEAFD;--purple-m:#C5B8FA;
  --dark:#0D0D12;--card:#16161E;--border:rgba(255,255,255,0.08);
  --mid:rgba(255,255,255,0.5);--light:rgba(255,255,255,0.25);
  --white:#fff;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--dark);color:var(--white);
  min-height:100vh;
}

/* HEADER */
.hero{
  padding:48px 40px 36px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:24px;max-width:1200px;margin:0 auto;width:100%;
}
.hero-left h1{font-size:30px;font-weight:700;letter-spacing:-0.3px;line-height:1.2}
.hero-left h1 span{color:var(--purple-m)}
.hero-left p{font-size:14px;color:var(--mid);margin-top:6px}
.hero-right{display:flex;gap:8px;flex-shrink:0}
.hero-pill{
  font-size:11px;font-weight:600;padding:6px 14px;border-radius:100px;
  border:1px solid var(--border);color:var(--mid);cursor:pointer;
  transition:all 0.2s;background:transparent;
}
.hero-pill:hover,.hero-pill.active{border-color:var(--purple);color:var(--white);background:rgba(104,65,230,0.15)}

/* TIMELINE RAIL */
.rail-wrap{
  max-width:1200px;margin:0 auto;padding:0 40px;
  overflow-x:auto;scrollbar-width:none;
}
.rail-wrap::-webkit-scrollbar{display:none}
.rail{
  display:flex;align-items:flex-start;gap:0;
  padding:32px 0 20px;min-width:max-content;
}
.step{
  display:flex;flex-direction:column;align-items:center;
  width:140px;flex-shrink:0;cursor:pointer;
  position:relative;
}
/* connector line */
.step:not(:last-child)::after{
  content:'';position:absolute;
  top:12px;left:calc(50% + 12px);
  width:calc(140px - 24px);height:2px;
  background:var(--border);
}
.step.active:not(:last-child)::after,
.step.past:not(:last-child)::after{background:var(--purple-m)}
.step-dot{
  width:24px;height:24px;border-radius:50%;
  border:2px solid var(--border);background:var(--dark);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--light);
  transition:all 0.25s;position:relative;z-index:1;flex-shrink:0;
}
.step.active .step-dot{
  border-color:var(--purple);background:var(--purple);color:#fff;
  box-shadow:0 0 0 4px rgba(104,65,230,0.25);
}
.step.past .step-dot{border-color:var(--purple-m);background:rgba(104,65,230,0.2);color:var(--purple-m)}
.step-date{font-size:10px;color:var(--light);margin-top:6px;font-weight:500}
.step-label{font-size:11px;color:var(--mid);margin-top:2px;text-align:center;line-height:1.3;padding:0 4px}
.step.active .step-label{color:var(--white);font-weight:600}

/* MAIN VIEWER */
.viewer{
  max-width:1200px;margin:0 auto;padding:24px 40px 60px;
}
.viewer-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;gap:16px;
}
.viewer-meta{}
.viewer-index{font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--purple-m);margin-bottom:4px}
.viewer-title{font-size:22px;font-weight:700;color:var(--white)}
.viewer-date{font-size:13px;color:var(--mid);margin-top:3px}
.viewer-desc{font-size:14px;color:var(--mid);line-height:1.6;margin-top:4px;max-width:520px}
.viewer-nav{display:flex;gap:8px;flex-shrink:0}
.nav-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid var(--border);background:transparent;
  color:var(--mid);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.nav-btn:hover{border-color:var(--purple);color:var(--white);background:rgba(104,65,230,0.15)}
.nav-btn:disabled{opacity:0.25;cursor:default;pointer-events:none}

/* Screenshot display */
.img-wrap{
  border-radius:16px;overflow:hidden;
  border:1px solid var(--border);
  position:relative;
  box-shadow:0 24px 80px rgba(0,0,0,0.6);
}
.img-wrap img{
  width:100%;display:block;
  transition:opacity 0.3s ease;
}
.img-caption{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.7));
  padding:32px 20px 16px;
  font-size:12px;color:rgba(255,255,255,0.6);
  pointer-events:none;
}

/* Diff highlights */
.diff-bar{
  margin-top:16px;
  display:flex;gap:10px;flex-wrap:wrap;
}
.diff-chip{
  display:flex;align-items:center;gap:6px;
  background:rgba(104,65,230,0.12);
  border:1px solid rgba(104,65,230,0.3);
  border-radius:100px;
  padding:5px 12px;
  font-size:12px;color:var(--purple-m);
}
.diff-chip .dot{
  width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0;
}

/* Keyboard hint */
.kbd-hint{
  text-align:center;padding:16px;
  font-size:11px;color:var(--light);
}
kbd{
  background:rgba(255,255,255,0.08);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px;font-size:10px;font-family:monospace;
}
</style>
</head>
<body>

<div style="max-width:1200px;margin:0 auto;width:100%">
<div class="hero">
  <div class="hero-left">
    <h1>ACKO Copy Generator <span>— Change Map</span></h1>
    <p>Every real screenshot, in order. 7 commits · 6 days.</p>
  </div>
</div>
</div>

<!-- Timeline rail -->
<div class="rail-wrap">
  <div class="rail" id="rail"></div>
</div>

<!-- Viewer -->
<div class="viewer">
  <div class="viewer-header">
    <div class="viewer-meta">
      <div class="viewer-index" id="v-index"></div>
      <div class="viewer-title" id="v-title"></div>
      <div class="viewer-date" id="v-date"></div>
      <div class="viewer-desc" id="v-desc"></div>
    </div>
    <div class="viewer-nav">
      <button class="nav-btn" id="btn-prev">←</button>
      <button class="nav-btn" id="btn-next">→</button>
    </div>
  </div>
  <div class="img-wrap">
    <img id="main-img" src="" alt=""/>
    <div class="img-caption" id="img-cap"></div>
  </div>
  <div class="diff-bar" id="diff-bar"></div>
</div>

<div class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> to navigate</div>

const DIFFS = [
  ['One brief textarea', 'Generate × 3 number picker', 'Phone mockup on right', 'PN framework picker'],
  ['6 structured brief fields', '"Sign in as Writer" Google button', '"Describe the user" replaces "Problem statement"'],
  ['Tone dial: Warmer / Balanced / Direct', 'Single-variant regenerate button', 'Char counter (WA 160-char limit)'],
  ['Word rules panel between ToV + form', 'Upload banned words + replacements', '"Sign in as Writer" still present'],
  ['Re-parse button on ToV card', '"Log in" replaces Google sign-in button', 'Admin dashboard at /analytics', 'Turso DB migration done'],
  ['Profile avatar in top-right (post sign-in)', 'History page at /history', 'Date grouping + channel/LoB filters'],
  ['Purple animated border on Refine bar', 'Sparkle nudge every 4s', 'Direct +1/+2/+3 pills replace picker', 'Framework enforcement hardened'],
];

let current = 0;

function render() {
  const s = SLIDES[current];
  const d = DIFFS[current];

  // Rail
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  SLIDES.forEach((sl, i) => {
    const div = document.createElement('div');
    div.className = 'step' + (i === current ? ' active' : i < current ? ' past' : '');
    div.innerHTML = `<div class="step-dot">${i+1}</div><div class="step-date">${sl.date}</div><div class="step-label">${sl.label}</div>`;
    div.addEventListener('click', () => { current = i; render(); });
    rail.appendChild(div);
  });

  // Header
  document.getElementById('v-index').textContent = `Step ${current+1} of ${SLIDES.length}`;
  document.getElementById('v-title').textContent = s.label;
  document.getElementById('v-date').textContent = s.date;
  document.getElementById('v-desc').textContent = s.desc;

  // Image
  const img = document.getElementById('main-img');
  img.style.opacity = '0';
  img.src = s.img;
  img.onload = () => { img.style.opacity = '1'; };
  document.getElementById('img-cap').textContent = `${s.label} · ${s.date}`;

  // Diff chips
  const bar = document.getElementById('diff-bar');
  bar.innerHTML = d.map(t => `<div class="diff-chip"><div class="dot"></div>${t}</div>`).join('');

  // Nav buttons
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === SLIDES.length - 1;

  // Scroll active step into view
  const activeStep = document.querySelectorAll('.step')[current];
  if (activeStep) activeStep.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

document.getElementById('btn-prev').addEventListener('click', () => { if(current > 0) { current--; render(); } });
document.getElementById('btn-next').addEventListener('click', () => { if(current < SLIDES.length-1) { current++; render(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && current > 0) { current--; render(); }
  if (e.key === 'ArrowRight' && current < SLIDES.length-1) { current++; render(); }
});

render();
</script>
</body>
